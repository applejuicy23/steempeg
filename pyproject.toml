[project]
name = "steempeg"
dynamic = ["version"]
description = "Browse, recover, trim, and export Steam Game Recording clips with hardware-accelerated rendering."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "applejuicy23" },
]
keywords = ["steam", "steam-deck", "game-recording", "dash", "video-export", "video-trimming", "ffmpeg", "mpv"]

dependencies = [
    "PySide6",
    "python-mpv",   # imported in code as: import mpv
    "av",           # PyAV - i-frame preview
    "Pillow",       # PyAV frame -> QImage path in sniper
    "psutil",
    "requests",
]

[project.optional-dependencies]
dev = ["ruff"]

[project.urls]
Homepage = "https://applejuicy23.github.io/steempeg/"
Documentation = "https://applejuicy23.github.io/steempeg/docs/"
Changelog = "https://applejuicy23.github.io/steempeg/changelog.html"
Repository = "https://github.com/applejuicy23/steempeg"
Issues = "https://github.com/applejuicy23/steempeg/issues"

[project.scripts]
steempeg = "steempeg.app:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["steempeg*"]

[tool.setuptools.dynamic]
version = { attr = "steempeg.version.APP_VERSION_STR" }

[tool.ruff]
line-length = 100
